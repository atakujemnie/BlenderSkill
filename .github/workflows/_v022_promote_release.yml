name: v022 promote release

on:
  push:
    branches: [release/v0.22.0-visual-fidelity]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote v0.22 release metadata
        run: python tools/_v022_promote_release.py
      - name: Regenerate derived artifacts
        run: |
          python tools/build_full_library.py
          python tools/build_runtime_index.py
          python tools/validate_registry_parity.py
          python tools/validate_release_metadata.py
      - name: Commit release promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml MANIFEST.json README.md CHANGELOG.md \
            06_prompts/60_SYSTEM_PROMPT.md 06_prompts/62_REVIEWER_PROMPT.md \
            tools/validate_release_metadata.py _FULL_LIBRARY.md _RUNTIME_INDEX.json
          git commit -m "release: promote BlenderSkill v0.22.0 metadata"
          git push
