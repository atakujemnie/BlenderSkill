name: v0.18 Metadata Bootstrap

on:
  push:
    branches:
      - feat/v0.18-runtime-verification-completion
    paths:
      - '.github/workflows/_bootstrap-v018.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.18-runtime-verification-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate v0.18 metadata and committed artifacts
        run: python tools/_bootstrap_v018.py
      - name: Commit generated v0.18 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json README.md CHANGELOG.md _FULL_LIBRARY.md _RUNTIME_INDEX.json
          git diff --cached --quiet && exit 0
          git commit -m 'Promote BlenderSkill metadata to v0.18.0'
          git push origin HEAD:feat/v0.18-runtime-verification-completion
