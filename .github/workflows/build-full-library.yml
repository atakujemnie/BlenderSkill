name: Build Full Library

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - 'MANIFEST.json'
      - 'executors/**/*.py'
      - 'tools/build_full_library.py'
      - 'tools/upgrade_v014_metadata.py'
      - 'tools/test_v09_shape_graph.py'
      - 'tools/test_v010_reference_fidelity.py'
      - 'tools/test_v011_execution_enforcement.py'
      - 'tools/test_v012_geometric_integrity.py'
      - 'tools/test_v012_final_integrity_gate.py'
      - 'tools/test_v013_procedural_vegetation.py'
      - 'tools/test_v014_visual_quality.py'
      - '.github/workflows/build-full-library.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote canonical metadata to v0.14
        run: python tools/upgrade_v014_metadata.py
      - name: Run v0.9 Shape Graph regression smoke tests
        run: python tools/test_v09_shape_graph.py
      - name: Run v0.10 reference appearance/fidelity smoke tests
        run: python tools/test_v010_reference_fidelity.py
      - name: Run v0.11 execution-enforcement smoke tests
        run: python tools/test_v011_execution_enforcement.py
      - name: Run v0.12 geometric-integrity smoke tests
        run: python tools/test_v012_geometric_integrity.py
      - name: Run v0.12 final integrity/runtime-lock tests
        run: python tools/test_v012_final_integrity_gate.py
      - name: Run v0.13 procedural vegetation tests
        run: python tools/test_v013_procedural_vegetation.py
      - name: Run v0.14 visual quality/material/context tests
        run: python tools/test_v014_visual_quality.py
      - name: Generate compiled snapshot
        run: python tools/build_full_library.py
      - name: Commit canonical metadata and generated snapshot if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- MANIFEST.json README.md CHANGELOG.md 00_governance/04_KNOWLEDGE_ROUTER.md 00_governance/05_SEMANTIC_SKILL_REGISTRY.md 09_engine/profiles/RPG_PROJECT_ASSET_PIPELINE_PROFILE.md _FULL_LIBRARY.md)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json README.md CHANGELOG.md 00_governance/04_KNOWLEDGE_ROUTER.md 00_governance/05_SEMANTIC_SKILL_REGISTRY.md 09_engine/profiles/RPG_PROJECT_ASSET_PIPELINE_PROFILE.md _FULL_LIBRARY.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Promote BlenderSkill to v0.14.0'
          git push
