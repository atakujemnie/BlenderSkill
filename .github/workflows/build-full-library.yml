name: Build Full Library

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - 'MANIFEST.json'
      - 'executors/**/*.py'
      - 'tools/build_full_library.py'
      - 'tools/promote_v011.py'
      - 'tools/test_v09_shape_graph.py'
      - 'tools/test_v010_reference_fidelity.py'
      - 'tools/test_v011_execution_enforcement.py'
      - '.github/workflows/build-full-library.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote canonical release metadata to v0.11.0
        run: python tools/promote_v011.py
      - name: Run v0.9 Shape Graph regression smoke tests
        run: python tools/test_v09_shape_graph.py
      - name: Run v0.10 reference appearance/fidelity smoke tests
        run: python tools/test_v010_reference_fidelity.py
      - name: Run v0.11 execution-enforcement smoke tests
        run: python tools/test_v011_execution_enforcement.py
      - name: Generate compiled snapshot
        run: python tools/build_full_library.py
      - name: Commit generated/release metadata if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- MANIFEST.json README.md CHANGELOG.md _FULL_LIBRARY.md)" ]; then
            echo 'No generated or release metadata changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json README.md CHANGELOG.md _FULL_LIBRARY.md
          if git diff --cached --quiet; then
            echo 'No generated or release metadata changes.'
            exit 0
          fi
          git commit -m 'Promote BlenderSkill to v0.11.0 and regenerate library'
          git push
