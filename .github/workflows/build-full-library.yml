name: Build Full Library

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - 'MANIFEST.json'
      - 'executors/**/*.py'
      - 'tools/build_full_library.py'
      - 'tools/promote_v011.py'
      - 'tools/v011_preserve_v010_docs.py'
      - 'tools/test_v09_shape_graph.py'
      - 'tools/test_v010_reference_fidelity.py'
      - 'tools/test_v011_execution_enforcement.py'
      - '.github/workflows/build-full-library.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve v0.10 controller knowledge and apply v0.11 amendments
        run: python tools/v011_preserve_v010_docs.py
      - name: Promote canonical release metadata to v0.11.0
        run: python tools/promote_v011.py
      - name: Run v0.9 Shape Graph regression smoke tests
        run: python tools/test_v09_shape_graph.py
      - name: Run v0.10 reference appearance/fidelity smoke tests
        run: python tools/test_v010_reference_fidelity.py
      - name: Run v0.11 execution-enforcement smoke tests
        run: python tools/test_v011_execution_enforcement.py
      - name: Generate compiled snapshot
        run: python tools/build_full_library.py
      - name: Commit generated/release/controller files if changed
        shell: bash
        run: |
          FILES='MANIFEST.json README.md CHANGELOG.md _FULL_LIBRARY.md 00_governance/02_STATE_MACHINE.md 00_governance/04_KNOWLEDGE_ROUTER.md 00_governance/05_SEMANTIC_SKILL_REGISTRY.md 05_execution/70_RECONSTRUCTION_NODE_EXECUTION_PROTOCOL.md 06_prompts/60_SYSTEM_PROMPT.md 06_prompts/68_SHAPE_GRAPH_PLANNER_PROMPT.md 10_reconstruction/100_RECONSTRUCTION_LAYER_INDEX.md 10_reconstruction/107_MULTI_VIEW_CONFLICT_RESOLUTION.md 10_reconstruction/178_NODE_BY_NODE_MULTI_VIEW_VALIDATION.md'
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo 'No generated or release/controller changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          if git diff --cached --quiet; then
            echo 'No generated or release/controller changes.'
            exit 0
          fi
          git commit -m 'Preserve v0.10 knowledge and finalize v0.11.0 controller docs'
          git push
