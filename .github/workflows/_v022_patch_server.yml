name: v022 patch server
on:
  push:
    branches: [release/v0.22.0-visual-fidelity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/_v022_patch_server.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/server.py tests/integration/test_v021_studio_http.py
          git commit -m "v0.22: expose revision-bound fidelity review HTTP API"
          git push
