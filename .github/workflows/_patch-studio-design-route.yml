name: Patch Studio design route

on:
  push:
    branches:
      - feat/v020-production-studio-api

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v020-production-studio-api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/_patch_studio_design_route.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/server.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[skip ci] Serve Design System Studio from local API"
          git push origin HEAD:feat/v020-production-studio-api
