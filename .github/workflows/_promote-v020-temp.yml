name: Temporary v0.20 Promotion

on:
  push:
    branches:
      - 'release/v0.20.0-operational-production-studio'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v0.20.0-operational-production-studio

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote source metadata
        run: python tools/promote_v020_release.py

      - name: Build deterministic artifacts
        run: |
          python tools/build_full_library.py
          python tools/build_runtime_index.py
          python tools/validate_release_metadata.py

      - name: Commit promoted release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Promotion already materialized.'
            exit 0
          fi
          git commit -m 'Promote BlenderSkill v0.20.0 release state'
          git push origin HEAD:release/v0.20.0-operational-production-studio
