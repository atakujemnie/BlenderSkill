name: Promote v0.19 metadata

on:
  push:
    branches:
      - release/v0.19.0-production-studio-runtime

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v0.19.0-production-studio-runtime

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote release metadata and executor registry
        run: python tools/_promote_v019.py

      - name: Build generated artifacts
        run: |
          python tools/build_full_library.py
          python tools/build_runtime_index.py

      - name: Validate promoted release
        run: |
          python tools/validate_registry_parity.py
          python tools/validate_release_metadata.py
          pytest tests/regression/test_benchmark_89.py

      - name: Commit promotion output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Promotion already materialized."
            exit 0
          fi
          git commit -m "[skip ci] Promote runtime metadata to v0.19.0"
          git push origin HEAD:release/v0.19.0-production-studio-runtime
