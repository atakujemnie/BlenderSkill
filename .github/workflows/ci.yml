name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: python -m pip install 'pytest>=8.3,<9' 'ruff>=0.12,<1'

      - name: Ruff
        run: ruff check --output-format=github executors tests tools

      - name: Pytest unit
        run: pytest tests/unit

      - name: Pytest integration
        run: pytest tests/integration

      - name: Benchmark 87 regression
        run: pytest tests/regression

      - name: Legacy regressions v0.9-v0.17
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_v09_shape_graph.py
          python tools/test_v010_reference_fidelity.py
          python tools/test_v011_execution_enforcement.py
          python tools/test_v012_geometric_integrity.py
          python tools/test_v012_final_integrity_gate.py
          python tools/test_v013_procedural_vegetation.py
          python tools/test_v014_visual_quality.py
          python tools/test_v015_location_assembly.py
          python tools/test_v016_location_design_system.py
          python tools/test_v017_provider_discovery.py

      - name: v0.18 registry parity
        run: python tools/validate_registry_parity.py

      - name: Validate and build full library
        run: python tools/build_full_library.py

      - name: Build runtime index
        run: python tools/build_runtime_index.py

      - name: Validate release metadata
        run: python tools/validate_release_metadata.py

      - name: Generated artifacts must be committed
        run: git diff --exit-code -- MANIFEST.json _FULL_LIBRARY.md _RUNTIME_INDEX.json
