name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize v0.20 release state
        if: github.event_name == 'pull_request' && github.head_ref == 'release/v0.20.0-operational-production-studio'
        shell: bash
        run: |
          set -euo pipefail
          python tools/promote_v020_release.py
          python tools/build_full_library.py
          python tools/build_runtime_index.py
          python tools/validate_release_metadata.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Promote BlenderSkill v0.20.0 release state'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dev dependencies
        run: python -m pip install 'pytest>=8.3,<9' 'ruff>=0.12,<1'

      - name: Ruff changed Python
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACM "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.py')
          else
            mapfile -t files < <(git diff-tree --no-commit-id --name-only -r HEAD -- '*.py')
          fi
          if ((${#files[@]})); then
            ruff check --output-format=github "${files[@]}"
          else
            echo "No changed Python files to lint."
          fi

      - name: Pytest unit
        run: pytest tests/unit

      - name: Pytest integration
        run: pytest tests/integration

      - name: Benchmark regression
        run: pytest tests/regression

      - name: Legacy regressions v0.9-v0.17
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python tools/test_v09_shape_graph.py
          python tools/test_v010_reference_fidelity.py
          python tools/test_v011_execution_enforcement.py
          python tools/test_v012_geometric_integrity.py
          python tools/test_v012_final_integrity_gate.py
          python tools/test_v013_procedural_vegetation.py
          python tools/test_v014_visual_quality.py
          python tools/test_v015_location_assembly.py
          python tools/test_v016_location_design_system.py
          python tools/test_v017_provider_discovery.py

      - name: Registry parity
        run: python tools/validate_registry_parity.py

      - name: Validate and build full library
        run: python tools/build_full_library.py

      - name: Build runtime index
        run: python tools/build_runtime_index.py

      - name: Validate release metadata
        run: python tools/validate_release_metadata.py

      - name: Generated artifacts must be committed
        run: git diff --exit-code -- MANIFEST.json _FULL_LIBRARY.md _RUNTIME_INDEX.json
