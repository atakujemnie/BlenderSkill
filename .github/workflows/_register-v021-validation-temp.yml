name: Register v0.21 Validation (temporary)

on:
  push:
    branches:
      - release/v0.21.0-fidelity-enforcement

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.21.0-fidelity-enforcement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register validators and regenerate artifacts
        run: |
          python tools/register_v021_validation.py
          python tools/build_full_library.py
          python tools/build_runtime_index.py
          python tools/validate_registry_parity.py
          python tools/validate_release_metadata.py
      - name: Commit generated registry state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.json _FULL_LIBRARY.md _RUNTIME_INDEX.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "v0.21: register deterministic trusted validators"
          git push origin HEAD:release/v0.21.0-fidelity-enforcement
