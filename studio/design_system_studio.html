<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlenderSkill Design System Studio</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#171b20;--panel2:#1d232a;--line:#2d3640;--text:#e8edf2;--muted:#8e99a6;--accent:#65aaff;--good:#58bd82;--bad:#dd7070}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit;background:#222a32;border:1px solid #3b4652;border-radius:5px;padding:6px 9px}button{cursor:pointer}a{color:#acd3ff}.app{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr)}header{display:flex;gap:10px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:#15191e}header strong{margin-right:auto}.main{min-height:0;display:grid;grid-template-columns:360px minmax(480px,1fr)}.panel{min-height:0;border-right:1px solid var(--line);background:var(--panel)}.head{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}.head strong{margin-right:auto}.list{height:calc(100% - 40px);overflow:auto}.resource{padding:10px;border-bottom:1px solid rgba(45,54,64,.65);cursor:pointer}.resource:hover{background:#1d232a}.resource.active{background:#22364d}.title{font-weight:650}.meta{color:var(--muted);font-size:11px;margin-top:2px}.editor{min-height:0;overflow:auto;padding:14px}.card{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:12px;overflow:hidden}.card h3{margin:0;padding:9px 11px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px}.body{padding:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:8px}.field{display:grid;gap:4px;color:var(--muted);font-size:11px}.field input,.field select{width:100%;color:var(--text)}textarea{width:100%;min-height:260px;resize:vertical;background:#0e1318;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:7px;margin-top:10px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:8px;border:1px solid var(--line);border-radius:5px;background:#14191e}.metric label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric strong{font-size:17px}.empty{color:var(--muted);padding:20px}.error{color:#ffadad}.good{color:var(--good)}
</style>
</head>
<body><div class="app"><header><a href="/">Asset Studio</a><strong>Design System Studio</strong><select id="systemSelect"><option value="">All design systems</option></select><button id="refreshButton">Refresh</button><button id="newButton">New resource</button></header><main class="main"><section class="panel"><div class="head"><strong>Shared resources</strong><span id="count"></span></div><div id="resourceList" class="list"></div></section><section id="editor" class="editor"></section></main></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));let resources=[],selected=null;
async function api(path,options={}){const init={...options,headers:{"Content-Type":"application/json",...(options.headers||{})}};if(init.body&&typeof init.body!=="string")init.body=JSON.stringify(init.body);const r=await fetch(path,init),p=await r.json();if(!r.ok)throw new Error((p.blockers||[]).map(x=>x.reason).join(", ")||`HTTP ${r.status}`);return p}
async function refresh(){const systems=await api("/api/design-systems");const current=$("systemSelect").value;$("systemSelect").innerHTML=`<option value="">All design systems</option>`+(systems.design_systems||[]).map(x=>`<option value="${esc(x.design_system_id)}">${esc(x.design_system_id)} (${x.resource_count})</option>`).join("");$("systemSelect").value=current;const query=current?`?design_system_id=${encodeURIComponent(current)}`:"";const result=await api(`/api/design-resources${query}`);resources=result.resources||[];$("count").textContent=resources.length;renderList();if(selected){const match=resources.find(x=>x.design_system_id===selected.design_system_id&&x.resource_id===selected.resource_id);if(match)await openResource(match.design_system_id,match.resource_id)}}
function renderList(){$("resourceList").innerHTML=resources.length?resources.map(x=>`<div class="resource ${selected&&selected.resource_id===x.resource_id&&selected.design_system_id===x.design_system_id?"active":""}" data-ds="${esc(x.design_system_id)}" data-id="${esc(x.resource_id)}"><div class="title">${esc(x.resource_id)}</div><div class="meta">${esc(x.design_system_id)} · ${esc(x.kind)} · v${esc(x.version)} · r${esc(x.revision)} · ${x.affected_asset_count||0} assets</div></div>`).join(""):`<div class="empty">No persisted design resources.</div>`;document.querySelectorAll(".resource").forEach(el=>el.onclick=()=>openResource(el.dataset.ds,el.dataset.id))}
async function openResource(ds,id){const result=await api(`/api/design-systems/${encodeURIComponent(ds)}/resources/${encodeURIComponent(id)}`);selected={...result.resource,impact:result.impact};renderEditor();renderList()}
function field(name,label,value,type="text",readonly=false){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value??"")}" ${readonly?"readonly":""}></label>`}
function renderEditor(){if(!selected){$("editor").innerHTML=`<div class="empty">Select a resource or create a new one.</div>`;return}const impact=selected.impact||{};$("editor").innerHTML=`<div class="card"><h3>Resource identity</h3><div class="body"><form id="resourceForm"><div class="grid">${field("design_system_id","Design system",selected.design_system_id,"text",Number(selected.revision)>0)}${field("resource_id","Resource ID",selected.resource_id,"text",Number(selected.revision)>0)}<label class="field">Kind<select name="kind">${["MATERIAL","TEXTURE_SET","TRIM_PROFILE","EDGE_PROFILE","LED_PROFILE","DETAIL_MODULE","DECAL","FASTENER","GEOMETRY_MODULE","NODE_GROUP"].map(k=>`<option ${k===selected.kind?"selected":""}>${k}</option>`).join("")}</select></label>${field("version","Semantic version",selected.version||"1.0.0")}<label class="field">Locked<select name="locked"><option value="true" ${selected.locked?"selected":""}>true</option><option value="false" ${!selected.locked?"selected":""}>false</option></select></label>${field("revision","Repository revision",selected.revision||1,"number",true)}</div><label class="field" style="margin-top:9px">Resource payload JSON<textarea name="payload" spellcheck="false">${esc(JSON.stringify(selected.payload||{},null,2))}</textarea></label><div class="actions"><button type="submit">Save resource</button><span id="saveState" class="meta"></span></div></form></div></div><div class="card"><h3>Reverse usage / impact</h3><div class="body"><div class="metric-grid"><div class="metric"><label>Affected assets</label><strong>${esc(impact.affected_asset_count||0)}</strong></div><div class="metric"><label>Current version</label><strong>${esc(impact.current_version||selected.version||"")}</strong></div><div class="metric"><label>Locked</label><strong>${selected.locked?"yes":"no"}</strong></div></div><div class="meta" style="margin-top:9px">${esc((impact.affected_assets||[]).join(", ")||"No recorded consumers.")}</div></div></div>`;$("resourceForm").onsubmit=saveResource}
function newResource(){selected={design_system_id:$("systemSelect").value||"ASTERA_CIVIC",resource_id:"",kind:"MATERIAL",version:"1.0.0",revision:0,locked:true,payload:{},impact:{affected_asset_count:0,affected_assets:[]}};renderEditor();renderList()}
async function saveResource(event){event.preventDefault();const form=new FormData(event.currentTarget);let payload;try{payload=JSON.parse(form.get("payload"))}catch{$("saveState").innerHTML=`<span class="error">Invalid payload JSON</span>`;return}const expected=Number(selected.revision||0),resource={design_system_id:form.get("design_system_id"),resource_id:form.get("resource_id"),kind:form.get("kind"),version:form.get("version"),revision:expected||1,locked:form.get("locked")==="true",payload};try{const result=await api("/api/design-resources",{method:"POST",body:{expected_revision:expected,resource}});$("saveState").innerHTML=`<span class="good">Saved r${result.revision}</span>`;selected={...resource,revision:result.revision};await refresh()}catch(e){$("saveState").innerHTML=`<span class="error">${esc(e.message)}</span>`}}
$("refreshButton").onclick=()=>refresh().catch(e=>alert(e.message));$("newButton").onclick=newResource;$("systemSelect").onchange=()=>{selected=null;refresh().catch(e=>alert(e.message))};refresh().catch(e=>{$("editor").innerHTML=`<div class="empty error">${esc(e.message)}</div>`});
</script></body></html>
