<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlenderSkill Asset Production Studio</title>
  <style>
    :root{color-scheme:dark;--bg:#101318;--panel:#171b20;--panel2:#1d232a;--line:#2d3640;--text:#e8edf2;--muted:#8f9aa6;--accent:#63a9ff;--good:#58bd82;--warn:#d8a64d;--bad:#dc6b6b;--selected:#22364d}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit;color:inherit;background:#222a32;border:1px solid #3a4551;border-radius:5px;padding:6px 9px}button{cursor:pointer}button:hover{border-color:#617182}button:disabled{opacity:.4;cursor:default}.primary{border-color:#416f9f;color:#b9dcff}.danger{border-color:#724646;color:#ffb1b1}
    .app{height:100vh;display:grid;grid-template-rows:54px minmax(0,1fr) 210px}.topbar{display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--line);background:#15191e}.brand{font-weight:750;white-space:nowrap}.asset-picker{max-width:260px}.asset-title{min-width:0;flex:1}.asset-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-title span{font-size:11px;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);white-space:nowrap}.badge.live{border-color:#426f55;color:#91d4aa}.badge.offline{border-color:#765b32;color:#ebca8a}
    .main{min-height:0;display:grid;grid-template-columns:270px minmax(440px,1fr) 390px}.panel{min-height:0;background:var(--panel);border-right:1px solid var(--line)}.panel-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#cbd3dc}.scroll{height:calc(100% - 38px);overflow:auto}
    .tree-row{min-height:40px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:6px 9px 6px calc(10px + var(--depth,0)*16px);border-bottom:1px solid rgba(44,52,61,.55);cursor:pointer}.tree-row:hover{background:#1c2229}.tree-row.selected{background:var(--selected)}.tree-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree-meta,.record-meta{font-size:11px;color:var(--muted)}.count{min-width:22px;text-align:center;border-radius:10px;padding:1px 6px;background:#252e37;color:var(--muted)}
    .workspace{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:#12161b}.stages{display:grid;grid-template-columns:repeat(10,minmax(86px,1fr));overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}.stage{min-width:86px;padding:9px 7px;border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);font-size:10px}.stage.done{color:#a9b5c1;background:#1a2026}.stage.current{color:#b9dbff;background:#20364e;box-shadow:inset 0 -2px 0 var(--accent)}.stage.pending{opacity:.55}.stage.next{opacity:1;color:#d7e8fb}.canvas{min-height:0;overflow:auto;padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:11px;align-content:start}.card{border:1px solid var(--line);background:var(--panel);border-radius:7px;overflow:hidden}.card h3{margin:0;padding:9px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px}.card-body{padding:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.metric{border:1px solid var(--line);border-radius:5px;padding:8px;background:#14191e}.metric label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric strong{display:block;margin-top:2px;font-size:15px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.record,.evidence{border:1px solid var(--line);border-radius:5px;padding:8px;background:#14191e;margin-bottom:7px}.record-title{font-weight:650;margin-bottom:4px}.empty{color:var(--muted);padding:8px 0}
    .inspector{min-height:0;display:grid;grid-template-rows:38px 36px minmax(0,1fr);background:var(--panel)}.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}.tab{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:0 8px;color:var(--muted);font-size:11px}.tab.active{color:var(--text);background:#20262d;box-shadow:inset 0 -2px 0 var(--accent)}.inspector-body{overflow:auto;padding:10px}.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:5px 9px;padding:6px 0;border-bottom:1px solid rgba(44,52,61,.55)}.kv dt{color:var(--muted)}.kv dd{margin:0;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.form{display:grid;gap:7px;margin-bottom:10px;padding:9px;border:1px solid var(--line);border-radius:6px;background:#13181d}.form label{display:grid;gap:3px;color:var(--muted);font-size:11px}.form input,.form select{width:100%}
    .status{font-weight:650}.status.PASS,.status.APPROVED,.status.READY{color:var(--good)}.status.BLOCKED,.status.REVIEW{color:var(--warn)}.status.FAIL,.status.FAILED{color:var(--bad)}.queue{min-height:0;border-top:1px solid var(--line);background:#15191e;display:grid;grid-template-rows:39px minmax(0,1fr)}.queue-head{display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--line)}.queue-head strong{font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-right:auto}.queue-grid{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid rgba(44,52,61,.65);white-space:nowrap}th{position:sticky;top:0;background:#1b2026;color:var(--muted);font-size:10px;text-transform:uppercase;z-index:1}td.wide{width:100%}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:30}.overlay.open{display:flex}.dialog{width:min(900px,92vw);height:min(700px,86vh);background:var(--panel);border:1px solid #465360;border-radius:8px;display:grid;grid-template-rows:44px minmax(0,1fr) 48px}.dialog header,.dialog footer{display:flex;align-items:center;gap:7px;padding:0 11px}.dialog header{border-bottom:1px solid var(--line)}.dialog footer{border-top:1px solid var(--line);justify-content:flex-end}.dialog textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:#0f1318;padding:11px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.error{color:#ff9f9f;margin-right:auto}.toast{position:fixed;right:14px;bottom:224px;z-index:40;max-width:500px;padding:9px 12px;border:1px solid #42505d;border-radius:6px;background:#1c232a;box-shadow:0 8px 30px rgba(0,0,0,.35);display:none}.toast.show{display:block}.toast.bad{border-color:#764b4b;color:#ffc0c0}@media(max-width:1150px){.main{grid-template-columns:220px minmax(360px,1fr) 330px}.canvas{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">BlenderSkill Studio</div>
    <select id="assetSelect" class="asset-picker" title="Asset"></select><button id="refreshButton">Refresh</button>
    <div class="asset-title"><strong id="assetName">No asset</strong><span id="assetMeta">Runtime not loaded</span></div>
    <span id="modeBadge" class="badge"></span><span id="stageBadge" class="badge"></span><span id="revisionBadge" class="badge"></span><button id="jsonButton">JSON</button>
  </header>
  <main class="main">
    <section class="panel"><div class="panel-head"><span>Components</span><span id="componentCount">0</span></div><div id="componentTree" class="scroll"></div></section>
    <section class="workspace"><div id="stages" class="stages"></div><div class="canvas">
      <div class="card"><h3>Selected component</h3><div class="card-body"><div id="componentMetrics" class="metrics"></div><div id="componentActions" class="actions"></div></div></div>
      <div class="card"><h3>Production state</h3><div class="card-body"><div id="productionMetrics" class="metrics"></div></div></div>
      <div class="card"><h3>Reference evidence</h3><div id="referenceEvidence" class="card-body"></div></div>
      <div class="card"><h3>Trusted validation</h3><div id="validationReceipts" class="card-body"></div></div>
      <div class="card"><h3>Open corrections</h3><div id="correctionList" class="card-body"></div></div>
      <div class="card"><h3>Design-system impact</h3><div id="impactList" class="card-body"></div></div>
    </div></section>
    <aside class="inspector"><div class="panel-head"><span>Inspector</span><span id="selectedLabel"></span></div><div id="tabs" class="tabs"></div><div id="inspectorBody" class="inspector-body"></div></aside>
  </main>
  <section class="queue"><div class="queue-head"><strong>Production task queue</strong><span id="taskSummary" class="badge"></span><button id="promoteTasksButton">Promote ready</button></div><div class="queue-grid"><table><thead><tr><th>Task</th><th>Component</th><th>Kind</th><th>Status</th><th>Priority</th><th>Attempt</th><th class="wide">Required validation</th><th>Action</th></tr></thead><tbody id="taskTable"></tbody></table></div></section>
</div>
<div id="jsonOverlay" class="overlay"><div class="dialog"><header><strong>Studio JSON</strong></header><textarea id="jsonTextarea" spellcheck="false"></textarea><footer><span id="jsonError" class="error"></span><button id="closeJsonButton">Close</button><button id="applyJsonButton">Apply offline JSON</button></footer></div></div>
<div id="toast" class="toast"></div>
<script>
const EMPTY_MODEL={schema_version:2,asset:null,stages:[],components:[],selected_component_id:null,task_summary:{},tasks:[],runtime_revisions:{asset:0,task_queue:0,reference_evidence:0,scene:0},validation_revision:0,inspector:{component:{},resolved_parameters:{},design_bindings:{},open_corrections:[],tasks:[],scene_objects:[],reference_evidence:[],validation_receipts:[]},design_impacts:[],scene_snapshot_hash:null};
let model=structuredClone(EMPTY_MODEL),selected="",activeTab="Parameters",live=location.protocol==="http:"||location.protocol==="https:",assetIndex=[];
const TABS=["Parameters","Bindings","Corrections","References","Validation","Scene","Raw"],$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function toast(message,bad=false){const el=$("toast");el.textContent=message;el.className="toast show"+(bad?" bad":"");clearTimeout(el._timer);el._timer=setTimeout(()=>el.className="toast",4200)}
async function api(path,options={}){const init={cache:"no-store",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}};if(init.body&&typeof init.body!=="string")init.body=JSON.stringify(init.body);const response=await fetch(path,init);let payload={};try{payload=await response.json()}catch{payload={status:"FAIL",blockers:[{reason:"INVALID_SERVER_RESPONSE"}]}}if(!response.ok){const error=new Error((payload.blockers||[]).map(x=>x.reason).join(", ")||`HTTP ${response.status}`);error.payload=payload;error.httpStatus=response.status;throw error}return payload}
function taskList(){return Array.isArray(model.tasks)?model.tasks:[]}function componentMap(){return new Map((model.components||[]).map(x=>[x.component_id,x]))}function inspector(){return model.inspector||{}}function depthOf(id,map){let depth=0,current=map.get(id),guard=0;while(current?.parent&&map.has(current.parent)&&guard++<40){depth++;current=map.get(current.parent)}return depth}
async function loadAssets(preferred){if(!live)return;const result=await api("/api/assets");assetIndex=result.assets||[];const select=$("assetSelect");select.innerHTML=assetIndex.map(a=>`<option value="${esc(a.asset_id)}">${esc(a.asset_id)} · ${esc(a.name||"")}</option>`).join("");if(!assetIndex.length){model=structuredClone(EMPTY_MODEL);selected="";render();toast("Runtime has no assets. POST an asset to /api/assets or load offline JSON.",true);return}const id=preferred&&assetIndex.some(a=>a.asset_id===preferred)?preferred:assetIndex[0].asset_id;select.value=id;const sameAsset=model.asset?.asset_id===id;await loadStudio(id,sameAsset?selected:"")}
async function loadStudio(assetId,component=""){if(!live)return;const fetchView=async candidate=>{const query=candidate?`?component=${encodeURIComponent(candidate)}`:"";return api(`/api/assets/${encodeURIComponent(assetId)}/studio${query}`)};let result;try{result=await fetchView(component)}catch(e){const reasons=(e.payload?.blockers||[]).map(x=>x.reason);if(component&&(reasons.includes("STUDIO_COMPONENT_NOT_FOUND")||e.httpStatus===400)){result=await fetchView("");toast(`Component ${component} no longer exists; selected canonical root instead.`,true)}else throw e}model=result.view_model;selected=model.selected_component_id||model.components?.[0]?.component_id||"";activeTab="Parameters";render()}
async function refresh(){try{if(live)await loadAssets(model.asset?.asset_id);else render()}catch(e){toast(`Studio refresh failed: ${e.message}`,true)}}
function metric(label,value){return `<div class="metric"><label>${esc(label)}</label><strong>${esc(value)}</strong></div>`}
function renderTop(){const asset=model.asset||{};$("assetName").textContent=asset.name||asset.asset_id||"No asset";$("assetMeta").textContent=asset.asset_id?`${asset.asset_id} · ${(asset.design_system_ids||[]).join(" + ")||"no design system"}`:"Runtime state unavailable";$("stageBadge").textContent=asset.stage||"NO STAGE";$("revisionBadge").textContent=`r${asset.revision??0}`;$("modeBadge").textContent=live?"LIVE":"OFFLINE";$("modeBadge").className=`badge ${live?"live":"offline"}`;$("assetSelect").style.display=live?"block":"none"}
function renderStages(){const stages=model.stages||[],current=stages.findIndex(x=>x.state==="CURRENT");$("stages").innerHTML=stages.map((x,i)=>`<button class="stage ${esc(String(x.state||"").toLowerCase())} ${live&&i===current+1?"next":""}" data-stage="${esc(x.stage)}">${esc(x.stage)}</button>`).join("");document.querySelectorAll(".stage.next").forEach(button=>button.onclick=()=>advanceStage(button.dataset.stage))}
function renderTree(){const items=model.components||[],map=componentMap();$("componentCount").textContent=items.length;$("componentTree").innerHTML=items.length?items.map(item=>`<div class="tree-row ${item.component_id===selected?"selected":""}" data-component="${esc(item.component_id)}" style="--depth:${depthOf(item.component_id,map)}"><div><div class="tree-name">${esc(item.component_id)}</div><div class="tree-meta">${esc(item.state||"UNKNOWN")} · ${esc(item.shape_class||"UNCLASSIFIED")}</div></div><span class="count">${esc((item.task_statuses||[]).length)}</span></div>`).join(""):`<div class="empty" style="padding:12px">No runtime components.</div>`;document.querySelectorAll(".tree-row").forEach(row=>row.onclick=async()=>{const id=row.dataset.component;if(live){try{await loadStudio(model.asset.asset_id,id)}catch(e){toast(e.message,true)}}else{selected=id;render()}})}
function renderWorkspace(){const comp=componentMap().get(selected)||{},ins=inspector(),params=ins.resolved_parameters||{},objects=ins.scene_objects||[],tasks=taskList(),receipts=ins.validation_receipts||[];$("componentMetrics").innerHTML=[metric("Component",selected||"—"),metric("State",comp.state||ins.component?.state||"—"),metric("Parameters",Object.keys(params).length),metric("Scene objects",objects.length)].join("");let actions="";if(live&&selected){const state=String(comp.state||ins.component?.state||"").toUpperCase();if(["CONSTRAINED","DIRTY","UNVERIFIED","FAIL"].includes(state))actions+=`<button id="authorizeButton" class="primary">Authorize build</button>`;actions+=`<button id="prepareTaskButton">Prepare task pack</button><button id="createTaskButton">Create repair task</button>`}$("componentActions").innerHTML=actions;if($("authorizeButton"))$("authorizeButton").onclick=authorizeSelected;if($("prepareTaskButton"))$("prepareTaskButton").onclick=prepareTaskPack;if($("createTaskButton"))$("createTaskButton").onclick=createRepairTask;const open=(model.components||[]).reduce((sum,item)=>sum+Number(item.open_correction_count||0),0),rev=model.runtime_revisions||{};$("productionMetrics").innerHTML=[metric("Asset progress",`${Math.round(Number(model.asset?.progress||0)*100)}%`),metric("Tasks",tasks.length),metric("Open corrections",open),metric("Revisions",`${rev.asset||0}/${rev.task_queue||0}/${rev.reference_evidence||0}/${rev.scene||0} · V${model.validation_revision||0}`)].join("");const evidence=ins.reference_evidence||[];$("referenceEvidence").innerHTML=evidence.length?evidence.map(x=>`<div class="evidence"><div class="record-title">${esc(x.view||"DETAIL")} · ${esc(x.authority||"PRIMARY")}</div><div class="record-meta">${esc(x.evidence_id||x.reference_id||"")} · ROI ${esc(JSON.stringify(x.roi||[]))}</div></div>`).join(""):`<div class="empty">No evidence routed to this component.</div>`;$("validationReceipts").innerHTML=receipts.length?receipts.map(x=>`<div class="record"><div class="record-title"><span class="status ${esc(x.status)}">${esc(x.status)}</span> ${esc(x.validator_id)}</div><div class="record-meta">${esc(x.receipt_id)} · scene r${esc(x.scene_revision)} · validator ${esc(x.validator_version)}</div></div>`).join(""):`<div class="empty">No trusted validation receipts for the current asset revision.</div>`;const corrections=ins.open_corrections||[];$("correctionList").innerHTML=corrections.length?corrections.map(x=>`<div class="record"><div class="record-title">${esc(x.id||x.kind||"Correction")}</div><div class="record-meta">${esc(x.priority||"")} · ${esc(x.status||"")}</div>${live?`<div class="actions"><button data-resolve="${esc(x.id)}">Resolve</button></div>`:""}</div>`).join(""):`<div class="empty">No open corrections.</div>`;document.querySelectorAll("[data-resolve]").forEach(button=>button.onclick=()=>resolveCorrection(button.dataset.resolve));const impacts=model.design_impacts||[];$("impactList").innerHTML=impacts.length?impacts.map(x=>`<div class="record"><div class="record-title">${esc(x.resource_id||"Resource")}</div><div class="record-meta">${esc(x.affected_asset_count??0)} affected assets</div></div>`).join(""):`<div class="empty">No persisted design-resource impact records.</div>`}
function renderKv(record){return Object.entries(record||{}).map(([key,value])=>`<dl class="kv"><dt>${esc(key)}</dt><dd>${typeof value==="object"?esc(JSON.stringify(value)):esc(value)}</dd></dl>`).join("")}
function renderTabs(){$("tabs").innerHTML=TABS.map(tab=>`<button class="tab ${tab===activeTab?"active":""}" data-tab="${tab}">${tab}</button>`).join("");document.querySelectorAll(".tab").forEach(button=>button.onclick=()=>{activeTab=button.dataset.tab;renderTabs();renderInspector()})}
function renderInspector(){const ins=inspector();$("selectedLabel").textContent=selected;let html="";if(activeTab==="Parameters")html=renderKv(ins.resolved_parameters||{});if(activeTab==="Bindings")html=renderKv(ins.design_bindings||{});if(activeTab==="Validation")html=(ins.validation_receipts||[]).map(x=>`<div class="record">${renderKv(x)}</div>`).join("")||`<div class="empty">No trusted receipts.</div>`;if(activeTab==="Scene")html=(ins.scene_objects||[]).map(x=>`<div class="record">${renderKv(x)}</div>`).join("")||`<div class="empty">No scoped scene objects.</div>`;if(activeTab==="Corrections"){html=live&&selected?`<form id="correctionForm" class="form"><label>ID<input name="id" value="COR-${Date.now()}"></label><label>Parameter<input name="parameter"></label><label>Value<input name="value"></label><label>Unit<input name="unit"></label><label>Priority<select name="priority"><option>HARD</option><option>CANONICAL</option><option>SOFT</option></select></label><button class="primary" type="submit">Add correction</button></form>`:"";html+=(ins.open_corrections||[]).map(x=>`<div class="record">${renderKv(x)}</div>`).join("")||`<div class="empty">No open corrections.</div>`}if(activeTab==="References"){html=live&&selected?`<form id="evidenceForm" class="form"><label>Evidence ID<input name="evidence_id" value="EV-${Date.now()}"></label><label>Reference ID<input name="reference_id"></label><label>View<select name="view"><option>FRONT</option><option>SIDE</option><option>TOP</option><option>DETAIL</option><option>PERSPECTIVE</option></select></label><label>Feature IDs<input name="feature_ids"></label><label>ROI x1,y1,x2,y2<input name="roi"></label><label>Artifact ID<input name="artifact_id"></label><button class="primary" type="submit">Add / update evidence</button></form>`:"";html+=(ins.reference_evidence||[]).map(x=>`<div class="record"><div class="record-title">${esc(x.evidence_id)}</div>${renderKv(x)}${live?`<div class="actions"><button class="danger" data-delete-evidence="${esc(x.evidence_id)}">Delete</button></div>`:""}</div>`).join("")||`<div class="empty">No routed reference evidence.</div>`}if(activeTab==="Raw")html=`<pre style="white-space:pre-wrap;margin:0;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace">${esc(JSON.stringify(ins,null,2))}</pre>`;$("inspectorBody").innerHTML=html;if($("correctionForm"))$("correctionForm").onsubmit=submitCorrection;if($("evidenceForm"))$("evidenceForm").onsubmit=submitEvidence;document.querySelectorAll("[data-delete-evidence]").forEach(button=>button.onclick=()=>deleteEvidence(button.dataset.deleteEvidence))}
function taskAction(task){if(!live)return"";if(task.status==="READY")return `<button data-task-action="start" data-task="${esc(task.task_id)}">Start</button>`;if(task.status==="BLOCKED"||task.status==="FAILED")return `<button data-task-action="retry" data-task="${esc(task.task_id)}">Retry</button>`;if(task.status==="REVIEW")return `<button data-task-action="approve" data-task="${esc(task.task_id)}">Approve</button>`;return""}
function renderQueue(){const tasks=taskList(),ready=tasks.filter(t=>t.status==="READY").length,blocked=tasks.filter(t=>t.status==="BLOCKED").length;$("taskSummary").textContent=`${tasks.length} tasks · ${ready} ready · ${blocked} blocked`;$("promoteTasksButton").disabled=!live||!(model.runtime_revisions?.task_queue>0);$("taskTable").innerHTML=tasks.length?tasks.map(t=>`<tr><td>${esc(t.task_id)}</td><td>${esc(t.component_id)}</td><td>${esc(t.task_kind||"")}</td><td><span class="status ${esc(t.status)}">${esc(t.status)}</span></td><td>${esc(t.priority??"")}</td><td>${esc(t.attempt??0)}</td><td class="wide">${esc((t.required_validation_ids||[]).join(", "))}</td><td>${taskAction(t)}</td></tr>`).join(""):`<tr><td colspan="8" class="empty">No tasks.</td></tr>`;document.querySelectorAll("[data-task-action]").forEach(button=>button.onclick=()=>taskTransition(button.dataset.task,button.dataset.taskAction))}
function render(){renderTop();renderStages();renderTree();renderWorkspace();renderTabs();renderInspector();renderQueue()}
async function post(path,body){return api(path,{method:"POST",body})}
async function authorizeSelected(){try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/components/${encodeURIComponent(selected)}/authorize`,{expected_asset_revision:model.runtime_revisions.asset,authorization:{status:"PASS",validator_id:"EXECUTION_AUTHORIZATION_GATE",validator_version:"0.21.0",actor:"STUDIO_USER"}});toast(`${selected} authorized for build`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function advanceStage(stage){try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/stage`,{new_stage:stage,expected_asset_revision:model.runtime_revisions.asset});toast(`Advanced to ${stage}`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function submitCorrection(event){event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));let value=data.value;if(value!==""&&!Number.isNaN(Number(value)))value=Number(value);try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/corrections`,{expected_asset_revision:model.runtime_revisions.asset,correction:{id:data.id,component_id:selected,kind:"PARAMETER_OVERRIDE",parameter:data.parameter,value,unit:data.unit,priority:data.priority}});toast("Correction added");await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function resolveCorrection(id){try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/corrections/${encodeURIComponent(id)}/resolve`,{expected_asset_revision:model.runtime_revisions.asset,resolution:{source:"STUDIO_UI",accepted:true}});toast(`${id} resolved`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function submitEvidence(event){event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));const features=data.feature_ids.split(",").map(x=>x.trim()).filter(Boolean),roi=data.roi.split(",").map(x=>Number(x.trim()));const evidence={evidence_id:data.evidence_id,reference_id:data.reference_id,component_id:selected,view:data.view,authority:"PRIMARY",feature_ids:features,artifact_id:data.artifact_id};if(roi.length===4&&roi.every(Number.isFinite))evidence.roi=roi;try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/evidence`,{expected_reference_revision:model.runtime_revisions.reference_evidence,evidence});toast("Evidence saved");await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function deleteEvidence(id){try{await api(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/evidence/${encodeURIComponent(id)}`,{method:"DELETE",body:{expected_reference_revision:model.runtime_revisions.reference_evidence}});toast(`${id} deleted`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function prepareTaskPack(){try{const result=await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/task-pack`,{component_id:selected,task_kind:"REPAIR"});$("jsonTextarea").value=JSON.stringify(result,null,2);$("jsonOverlay").classList.add("open");toast(`Task pack ${result.metrics?.estimated_input_tokens||"?"} tokens`)}catch(e){toast(e.message,true)}}
async function createRepairTask(){const id=`T-${selected}-${Date.now()}`;try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/tasks`,{expected_queue_revision:model.runtime_revisions.task_queue,task:{task_id:id,component_id:selected,task_kind:"REPAIR",priority:20}});toast(`${id} created`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function promoteTasks(){try{const result=await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/tasks/promote`,{expected_queue_revision:model.runtime_revisions.task_queue});toast(`Promoted: ${(result.promoted||[]).join(", ")||"none"}`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(e.message,true)}}
async function taskTransition(id,action){const mapping={start:["RUNNING","STUDIO_START"],retry:["READY","STUDIO_RETRY"],approve:["APPROVED","STUDIO_APPROVAL"]},entry=mapping[action];if(!entry)return;const body={expected_queue_revision:model.runtime_revisions.task_queue,target_status:entry[0],actor:"STUDIO_USER",reason:entry[1]};if(action==="start")body.worker_id="studio-manual";try{await post(`/api/assets/${encodeURIComponent(model.asset.asset_id)}/tasks/${encodeURIComponent(id)}/transition`,body);toast(`${id} -> ${entry[0]}`);await loadStudio(model.asset.asset_id,selected)}catch(e){toast(`Transition blocked: ${e.message}`,true)}}
$("refreshButton").onclick=refresh;$("assetSelect").onchange=()=>loadStudio($("assetSelect").value,"").catch(e=>toast(e.message,true));$("promoteTasksButton").onclick=promoteTasks;$("jsonButton").onclick=()=>{$("jsonTextarea").value=JSON.stringify(model,null,2);$("jsonError").textContent="";$("jsonOverlay").classList.add("open")};$("closeJsonButton").onclick=()=>$("jsonOverlay").classList.remove("open");$("applyJsonButton").onclick=()=>{try{const payload=JSON.parse($("jsonTextarea").value),next=payload.view_model||payload;if(!next.asset||!Array.isArray(next.components))throw new Error("Expected Studio view_model JSON");model=next;model.tasks=model.tasks||model.inspector?.tasks||[];selected=model.selected_component_id||model.components[0]?.component_id||"";live=false;$("jsonOverlay").classList.remove("open");render();toast("Offline JSON applied")}catch(e){$("jsonError").textContent=e.message}};
(async()=>{if(live){try{await loadAssets()}catch(e){model=structuredClone(EMPTY_MODEL);selected="";render();toast(`Studio API unavailable: ${e.message}`,true)}}else render()})();
</script>
</body>
</html>
